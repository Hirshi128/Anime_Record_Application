<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>オフライン | Anime Record</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fafafa;
        color: #27272a;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(100%, 560px);
        margin: 0 auto;
        padding: 64px 24px;
        overflow-wrap: anywhere;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 8px;
      }
      .brand {
        margin: 20px 0 32px;
        font-size: 16px;
        font-weight: 700;
        color: #92400e;
      }
      h1 {
        font-size: 24px;
        line-height: 1.5;
      }
      p {
        font-size: 16px;
        line-height: 1.8;
        color: #52525b;
      }
      button {
        margin-top: 16px;
        min-height: 44px;
        border: 1px solid #171717;
        border-radius: 8px;
        padding: 10px 20px;
        background: #171717;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #0369a1;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <p class="brand">Anime Record</p>
      <h1>オフラインです</h1>
      <p>
        インターネットに接続できません。Wi-Fiやモバイル通信を確認してください。
      </p>
      <button type="button" id="retry">再試行</button>
    </main>
    <script>
      document
        .getElementById("retry")
        .addEventListener("click", () => window.location.reload());
    </script>
  </body>
</html>
